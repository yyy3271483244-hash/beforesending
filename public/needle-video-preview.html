<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needle &amp; Thread Alpha Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px;
      color: #625b56;
      font-family: system-ui, sans-serif;
      background: #eee9e1;
    }
    main { width: min(1180px, 100%); }
    .preview {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(103, 86, 80, .18);
      background-color: #f7f2e9;
      background-image:
        linear-gradient(45deg, rgba(123, 105, 98, .10) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(123, 105, 98, .10) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(123, 105, 98, .10) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(123, 105, 98, .10) 75%);
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      background-size: 32px 32px;
    }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; gap: 18px; align-items: center; margin-top: 16px; }
    button {
      border: 0;
      border-bottom: 1px solid currentColor;
      padding: 6px 2px;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }
    p { margin: 0 0 12px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p>透明 WebM 预览。切换背景可检查白边与透明通道。</p>
    <div class="preview" id="preview">
      <video autoplay muted loop playsinline controls>
        <source src="assets/writing-desk/needle-assets/needle_spool_alpha.webm" type="video/webm">
      </video>
    </div>
    <div class="controls">
      <button type="button" data-color="#f7f2e9">浅色背景</button>
      <button type="button" data-color="#59615d">深色背景</button>
      <button type="button" data-color="#d8c2c5">粉色背景</button>
    </div>
  </main>
  <script>
    const preview = document.querySelector('#preview');
    document.querySelectorAll('[data-color]').forEach((button) => {
      button.addEventListener('click', () => {
        preview.style.backgroundImage = 'none';
        preview.style.backgroundColor = button.dataset.color;
      });
    });
  </script>
</body>
</html>
